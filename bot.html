<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Bot</title><style>
:root{--bg:#050816;--card:rgba(8,14,34,.92);--line:rgba(143,119,255,.22);--violet:#8b6cff;--gold:#f4d37a;--muted:#7f8ba7;--bot-bg:linear-gradient(135deg,#050816,#30206d,#0b1025)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bot-bg);background-size:200% 200%;color:#fff;transition:background .55s ease}body{animation:bgShift 14s ease-in-out infinite}.wrap{min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,rgba(126,91,255,.12),transparent 35%),radial-gradient(circle at 90% 85%,rgba(244,211,122,.06),transparent 32%)}.card{width:min(720px,100%);padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 25px 80px rgba(0,0,0,.42);animation:in .45s ease;overflow:hidden;backdrop-filter:blur(12px)}.logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#4a2bb0,#9d7422);color:var(--gold);font-size:24px;box-shadow:0 0 35px rgba(139,108,255,.25);animation:float 3s ease-in-out infinite}.title{margin-top:16px;font-size:23px;font-weight:850}.sub{font-size:12px;color:var(--muted);line-height:1.65;margin-top:5px}.secret-box{margin-top:22px;padding:18px;border:1px solid rgba(244,211,122,.18);border-radius:20px;background:rgba(244,211,122,.035);animation:in .35s ease}label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#d9def0;margin-bottom:9px}input{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(143,119,255,.25);background:#030716;color:#fff;outline:0;font:inherit}input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,108,255,.11)}button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#704fe0,#b68b36);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 10px 28px rgba(112,79,224,.18);transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:disabled{opacity:.6;cursor:not-allowed;transform:none}.error{margin-top:12px;color:#ff9cac;font-size:11px;line-height:1.5}.chat{display:none}.messages{height:390px;overflow:auto;padding:14px 2px;scroll-behavior:smooth}.msg{padding:11px 13px;border-radius:15px;margin:9px 0;max-width:85%;line-height:1.55;font-size:13px;white-space:pre-wrap;animation:msg .2s ease}.bot{background:rgba(16,26,53,.76);border:1px solid rgba(143,119,255,.13)}.user{margin-left:auto;background:linear-gradient(135deg,#4d328d,#5c3ba2)}.composer{display:flex;gap:9px}.composer input{flex:1}.composer button{width:auto;margin:0;padding:0 18px}.limit{margin-top:10px;font-size:10px;color:#7f8ba7}.thinking{width:29px;height:29px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid rgba(244,211,122,.38);color:var(--gold);font-weight:900;font-size:12px;animation:spin 1s linear infinite;box-shadow:0 0 18px rgba(244,211,122,.1)}.typing-cursor{display:inline-block;width:6px;height:14px;margin-left:2px;vertical-align:-2px;background:var(--gold);animation:blink .75s steps(1) infinite}.runtime-error{border-color:rgba(255,80,110,.35);background:rgba(78,12,28,.35);color:#ffb1bd}.disabled-screen{display:none;margin-top:20px;padding:28px 18px;border:1px solid rgba(255,55,85,.4);border-radius:22px;background:rgba(75,7,24,.45);text-align:center}.disabled-screen strong{display:block;color:#ff536f;font-size:22px;font-weight:950;letter-spacing:.04em}.disabled-screen span{display:block;margin-top:7px;color:#ffb1bd;font-size:12px}.disabled-mode .chat{display:none!important}.disabled-mode .disabled-screen{display:block}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes msg{from{opacity:0;transform:translateY(5px)}}@keyframes float{50%{transform:translateY(-4px)}}@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@media(prefers-reduced-motion:reduce){body{animation:none}.card,.logo,.thinking{animation:none}}
</style></head><body><main class="wrap"><section class="card" id="card"><div class="logo">⚡</div><div id="title" class="title">Secure Bot Access</div><div id="sub" class="sub">Enter the Secret ID for this bot to start chatting.</div><div id="request" class="secret-box"><label>SECRET ID REQUEST</label><input id="secret" autocomplete="off" placeholder="SDQXXXXXXXX"><button id="verify">Verify Secret ID</button><div id="error" class="error"></div></div><div id="disabledScreen" class="disabled-screen"><strong id="disabledTitle">BOT DISABLED</strong><span id="disabledSub">This bot is currently unavailable.</span></div><div id="chat" class="chat"><div id="messages" class="messages"></div><div id="limit" class="limit"></div><div class="composer"><input id="prompt" placeholder="Write a message..." autocomplete="off"><button id="send">Send</button></div><div id="chatError" class="error runtime-error" style="display:none"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://bopezesfrmdxiagvvyyh.supabase.co','sb_publishable_eLAz-YGqz0ET4n7t1g9BOA_suPeofcR',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const RUNTIME_URL='https://bopezesfrmdxiagvvyyh.supabase.co/functions/v1/bot-chat-runtime';const botId=new URLSearchParams(location.search).get('bot_id');let bot=null,ticket='';const $=x=>document.getElementById(x);const ref=document.referrer||'';let origin='unknown';try{origin=new URL(ref).hostname||'unknown'}catch(e){}const key='sdq_ticket_'+btoa(origin).replace(/[^a-z0-9]/gi,'').slice(0,32)+'_'+String(botId||'').replace(/[^a-z0-9]/gi,'');function getCookie(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.split('=')[1]||''}function setCookie(n,v){document.cookie=n+'='+encodeURIComponent(v)+'; Max-Age=31536000; Path=/; Secure; SameSite=None'}function errText(code){return code==='BOT_DISABLED'?'Bot disabled.':code==='BOT_SUSPENDED'?'Bot suspended.':code==='CHAT_LIMIT_REACHED'?'Chat limit reached.':code==='REGISTERED_TICKET_REQUIRED'?'Secret ID required.':code==='INVALID_SECRET_ID'?'Invalid Secret ID.':code==='API_NOT_CONFIGURED'?'AI service is not configured.':code==='MODEL_NOT_CONFIGURED'?'AI model is not configured.':code==='INVALID_API_KEY'?'Invalid API key.':code==='NETWORK_ERROR'?'Network error.':'Unable to generate a response right now.'}function backgroundCss(value){switch(String(value||'')){case'gradient:violet-gold':return'linear-gradient(135deg,#24134d,#76551a,#0b1025)';case'gradient:midnight-blue':return'linear-gradient(135deg,#020617,#0b1d45,#050816)';case'gradient:obsidian':return'linear-gradient(135deg,#030303,#16131e,#050816)';default:return'linear-gradient(135deg,#050816,#30206d,#0b1025)'}}function applyBackground(value){const css=backgroundCss(value);document.documentElement.style.setProperty('--bot-bg',css);document.body.style.background=css;document.body.dataset.background=value||'gradient:navy-violet'}function add(w,t){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function setDisabled(code){$('card').classList.add('disabled-mode');$('request').style.display='none';$('chat').style.display='none';$('disabledTitle').textContent=code==='BOT_SUSPENDED'?'BOT SUSPENDED':'BOT DISABLED';$('disabledSub').textContent=code==='BOT_SUSPENDED'?'This bot is suspended and cannot receive messages.':'This bot is disabled and cannot receive messages.'}function openChat(info){bot=info;applyBackground(info.background_config);$('request').style.display='none';$('chat').style.display='block';$('title').textContent=info.name||'Secure Bot';$('sub').textContent='Secure connection established.';if(info.welcome_message&&!$('messages').children.length)add('bot',info.welcome_message)}async function resume(){if(!botId)return;$('error').textContent='';const saved=getCookie(key);if(!saved)return;const value=decodeURIComponent(saved);const {data}=await sb.rpc('resume_public_bot_website',{p_bot_id:botId,p_ticket:value});if(data?.ok){const {data:embed}=await sb.rpc('get_public_bot_embed_by_ticket',{p_bot_id:botId,p_ticket:value});if(embed?.ok){ticket=value;openChat(embed)}else if(embed?.error==='BOT_DISABLED'||embed?.error==='BOT_SUSPENDED')setDisabled(embed.error);else $('error').textContent=errText(embed?.error)}else if(data?.error==='BOT_DISABLED'||data?.error==='BOT_SUSPENDED')setDisabled(data.error)}async function verify(){const secret=$('secret').value.trim().toUpperCase();$('error').textContent='';if(!/^SDQ[A-Z0-9]{8}$/.test(secret)){$('error').textContent='Invalid Secret ID format.';return}$('verify').disabled=true;$('verify').textContent='Verifying...';const {data,error}=await sb.rpc('get_public_bot_embed',{p_bot_id:botId,p_secret_id:secret});if(error||!data?.ok){if(data?.error==='BOT_DISABLED'||data?.error==='BOT_SUSPENDED')setDisabled(data.error);else $('error').textContent=errText(data?.error);$('verify').disabled=false;$('verify').textContent='Verify Secret ID';return}const reg=await sb.rpc('register_public_bot_website',{p_bot_id:botId,p_secret_id:secret,p_origin:origin,p_referrer:ref||null});if(reg.error||!reg.data?.ok){$('error').textContent=errText(reg.data?.error);$('verify').disabled=false;$('verify').textContent='Verify Secret ID';return}ticket=reg.data.ticket;setCookie(key,ticket);openChat(data)}function thinkingNode(){const d=document.createElement('div');d.className='msg bot';d.innerHTML='<span class="thinking">S</span>';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}async function typeAnswer(node,text){node.textContent='';const cursor=document.createElement('span');cursor.className='typing-cursor';node.appendChild(cursor);for(const ch of String(text||'')){cursor.before(document.createTextNode(ch));$('messages').scrollTop=$('messages').scrollHeight;await new Promise(r=>setTimeout(r,ch==='.'||ch==='!'||ch==='?'?32:14))}cursor.remove()}async function send(){const text=$('prompt').value.trim();if(!text||!ticket)return;$('prompt').value='';add('user',text);const d=thinkingNode();$('send').disabled=true;$('prompt').disabled=true;$('chatError').style.display='none';try{const res=await fetch(RUNTIME_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:botId,ticket,message:text})});let data=null;try{data=await res.json()}catch(e){data={ok:false,code:'NETWORK_ERROR'}}if(!res.ok||!data?.ok){if(data?.code==='BOT_DISABLED'||data?.code==='BOT_SUSPENDED'){d.remove();setDisabled(data.code);return}d.classList.add('runtime-error');d.textContent=errText(data?.code);if(data?.code==='CHAT_LIMIT_REACHED'){d.textContent='Chat limit reached.';$('prompt').disabled=true;$('send').disabled=true}else{$('chatError').textContent=errText(data?.code);$('chatError').style.display='block';$('prompt').disabled=false;$('send').disabled=false}return}await typeAnswer(d,data.answer);$('limit').textContent='Chat remaining: '+Number(data.remaining||0)+' / '+Number(data.limit||0)}catch(e){d.classList.add('runtime-error');d.textContent='Network error.';$('chatError').textContent='Network error.';$('chatError').style.display='block';$('prompt').disabled=false;$('send').disabled=false}finally{if($('card').classList.contains('disabled-mode')){$('prompt').disabled=true;$('send').disabled=true}}}$('verify').onclick=verify;$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};if(!botId)$('error').textContent='Missing Bot ID.';else{applyBackground('gradient:navy-violet');resume()}
</script></body></html>
