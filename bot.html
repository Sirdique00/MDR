<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Bot</title><style>
:root{--bg:#050816;--card:rgba(8,14,34,.92);--line:rgba(143,119,255,.22);--violet:#8b6cff;--gold:#f4d37a;--muted:#7f8ba7;--bot-bg:linear-gradient(135deg,#050816,#30206d,#0b1025)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bot-bg);background-size:200% 200%;color:#fff;transition:background .55s ease}body{animation:bgShift 14s ease-in-out infinite}.wrap{min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,rgba(126,91,255,.12),transparent 35%),radial-gradient(circle at 90% 85%,rgba(244,211,122,.06),transparent 32%)}.card{width:min(720px,100%);padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 25px 80px rgba(0,0,0,.42);animation:in .45s ease;overflow:hidden;backdrop-filter:blur(12px)}.logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#4a2bb0,#9d7422);color:var(--gold);font-size:24px;box-shadow:0 0 35px rgba(139,108,255,.25);animation:float 3s ease-in-out infinite}.title{margin-top:16px;font-size:23px;font-weight:850}.sub{font-size:12px;color:var(--muted);line-height:1.65;margin-top:5px}.secret-box{margin-top:22px;padding:18px;border:1px solid rgba(244,211,122,.18);border-radius:20px;background:rgba(244,211,122,.035);animation:in .35s ease}label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#d9def0;margin-bottom:9px}input{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(143,119,255,.25);background:#030716;color:#fff;outline:0;font:inherit}input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,108,255,.11)}button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#704fe0,#b68b36);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 10px 28px rgba(112,79,224,.18);transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:disabled{opacity:.6;cursor:not-allowed;transform:none}.error{margin-top:12px;color:#ff9cac;font-size:11px}.chat{display:none}.messages{height:390px;overflow:auto;padding:14px 2px}.msg{padding:11px 13px;border-radius:15px;margin:9px 0;max-width:85%;line-height:1.55;font-size:13px;white-space:pre-wrap;animation:msg .2s ease}.bot{background:rgba(16,26,53,.76);border:1px solid rgba(143,119,255,.13)}.user{margin-left:auto;background:linear-gradient(135deg,#4d328d,#5c3ba2)}.composer{display:flex;gap:9px}.composer input{flex:1}.composer button{width:auto;margin:0;padding:0 18px}.limit{margin-top:10px;font-size:10px;color:#7f8ba7}.thinking{display:inline-flex;gap:5px;align-items:center}.thinking i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:b .8s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes msg{from{opacity:0;transform:translateY(5px)}}@keyframes float{50%{transform:translateY(-4px)}}@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@media(prefers-reduced-motion:reduce){body{animation:none}.card,.logo{animation:none}}
</style></head><body><main class="wrap"><section class="card"><div class="logo">⚡</div><div id="title" class="title">Secure Bot Access</div><div id="sub" class="sub">Enter the Secret ID for this bot to start chatting.</div><div id="request" class="secret-box"><label>SECRET ID REQUEST</label><input id="secret" autocomplete="off" placeholder="SDQXXXXXXXX"><button id="verify">Verify Secret ID</button><div id="error" class="error"></div></div><div id="chat" class="chat"><div id="messages" class="messages"></div><div id="limit" class="limit"></div><div class="composer"><input id="prompt" placeholder="Write a message..." autocomplete="off"><button id="send">Send</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://bopezesfrmdxiagvvyyh.supabase.co','sb_publishable_eLAz-YGqz0ET4n7t1g9BOA_suPeofcR',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const botId=new URLSearchParams(location.search).get('bot_id');let bot=null,ticket='';const $=x=>document.getElementById(x);const ref=document.referrer||'';let origin='unknown';try{origin=new URL(ref).hostname||'unknown'}catch(e){}const key='sdq_ticket_'+btoa(origin).replace(/[^a-z0-9]/gi,'').slice(0,32)+'_'+String(botId||'').replace(/[^a-z0-9]/gi,'');function getCookie(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.split('=')[1]||''}function setCookie(n,v){document.cookie=n+'='+encodeURIComponent(v)+'; Max-Age=31536000; Path=/; Secure; SameSite=None'}function errText(code){return code==='BOT_DISABLED'?'Bot disabled.':code==='BOT_SUSPENDED'?'Bot suspended.':code==='CHAT_LIMIT_REACHED'?'Chat limit reached.':code==='REGISTERED_TICKET_REQUIRED'?'Secret ID required.':'Secure access could not be verified.'}function backgroundCss(value){switch(String(value||'')){case'gradient:violet-gold':return'linear-gradient(135deg,#24134d,#76551a,#0b1025)';case'gradient:midnight-blue':return'linear-gradient(135deg,#020617,#0b1d45,#050816)';case'gradient:obsidian':return'linear-gradient(135deg,#030303,#16131e,#050816)';default:return'linear-gradient(135deg,#050816,#30206d,#0b1025)'}}function applyBackground(value){const css=backgroundCss(value);document.documentElement.style.setProperty('--bot-bg',css);document.body.style.background=css;document.body.dataset.background=value||'gradient:navy-violet'}function add(w,t){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}function openChat(info){bot=info;applyBackground(info.background_config);$('request').style.display='none';$('chat').style.display='block';$('title').textContent=info.name||'Secure Bot';$('sub').textContent='Secure connection established.';if(info.welcome_message)add('bot',info.welcome_message)}async function resume(){if(!botId)return;$('error').textContent='';const saved=getCookie(key);if(!saved)return;const value=decodeURIComponent(saved);const {data}=await sb.rpc('resume_public_bot_website',{p_bot_id:botId,p_ticket:value});if(data?.ok){const {data:embed}=await sb.rpc('get_public_bot_embed_by_ticket',{p_bot_id:botId,p_ticket:value});if(embed?.ok){ticket=value;openChat(embed)}else $('error').textContent=errText(embed?.error)}}async function verify(){const secret=$('secret').value.trim().toUpperCase();$('error').textContent='';if(!/^SDQ[A-Z0-9]{8}$/.test(secret)){$('error').textContent='Invalid Secret ID format.';return}$('verify').disabled=true;$('verify').textContent='Verifying...';const {data,error}=await sb.rpc('get_public_bot_embed',{p_bot_id:botId,p_secret_id:secret});if(error||!data?.ok){$('error').textContent=errText(data?.error);$('verify').disabled=false;$('verify').textContent='Verify Secret ID';return}const reg=await sb.rpc('register_public_bot_website',{p_bot_id:botId,p_secret_id:secret,p_origin:origin,p_referrer:ref||null});if(reg.error||!reg.data?.ok){$('error').textContent=errText(reg.data?.error);$('verify').disabled=false;$('verify').textContent='Verify Secret ID';return}ticket=reg.data.ticket;setCookie(key,ticket);openChat(data)}async function send(){const text=$('prompt').value.trim();if(!text||!ticket)return;$('prompt').value='';add('user',text);const d=document.createElement('div');d.className='msg bot';d.innerHTML='<span class="thinking"><i></i><i></i><i></i></span>';$('messages').appendChild(d);const gate=await sb.rpc('consume_public_bot_chat',{p_bot_id:botId,p_ticket:ticket});if(gate.error||!gate.data?.ok){d.textContent=errText(gate.data?.error);$('prompt').disabled=true;$('send').disabled=true;return}const remaining=Number(gate.data.remaining||0);$('limit').textContent='Chat remaining: '+remaining+' / '+Number(gate.data.limit||0);setTimeout(()=>{d.textContent='Bot runtime endpoint is not connected yet. Secure access and per-bot chat limit are active; AI generation will be connected in the Chat Runtime level.'},450)}$('verify').onclick=verify;$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter')send()};if(!botId)$('error').textContent='Missing Bot ID.';else{applyBackground('gradient:navy-violet');resume()}
</script></body></html>
