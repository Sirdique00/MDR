<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Bot</title><style>:root{--bg:#050816;--card:rgba(8,14,34,.92);--line:rgba(143,119,255,.22);--violet:#8b6cff;--gold:#f4d37a;--muted:#7f8ba7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#050816,#30206d,#0b1025);color:#fff}body{animation:bg 14s ease-in-out infinite;background-size:200% 200%}.wrap{min-height:100vh;padding:20px;display:grid;place-items:center}.card{width:min(720px,100%);padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 25px 80px #0008;backdrop-filter:blur(12px)}.logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#4a2bb0,#9d7422);color:var(--gold);font-size:24px}.title{margin-top:16px;font-size:23px;font-weight:850}.sub{font-size:12px;color:var(--muted);line-height:1.65;margin-top:5px}.secret-box{margin-top:22px;padding:18px;border:1px solid #f4d37a2e;border-radius:20px;background:#f4d37a09}label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#d9def0;margin-bottom:9px}input{width:100%;padding:14px;border-radius:14px;border:1px solid #8f77ff40;background:#030716;color:#fff;outline:0;font:inherit}button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#704fe0,#b68b36);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 10px 28px #704fe02e}button:disabled{opacity:.6;cursor:not-allowed}.error{margin-top:12px;color:#ff9cac;font-size:11px;line-height:1.5}.chat{display:none}.messages{height:390px;overflow:auto;padding:14px 2px}.msg{padding:11px 13px;border-radius:15px;margin:9px 0;max-width:85%;line-height:1.55;font-size:13px;white-space:pre-wrap}.bot{background:#101a35c2;border:1px solid #8f77ff21}.user{margin-left:auto;background:linear-gradient(135deg,#4d328d,#5c3ba2)}.composer{display:flex;gap:9px}.composer input{flex:1}.composer button{width:auto;margin:0;padding:0 18px}.limit{margin-top:10px;font-size:10px;color:#7f8ba7}.thinking{width:29px;height:29px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid #f4d37a61;color:var(--gold);font-weight:900;animation:spin 1s linear infinite}.typing{display:inline-block;width:6px;height:14px;margin-left:2px;background:var(--gold);animation:blink .75s steps(1) infinite}@keyframes spin{to{transform:rotate(360deg)}@keyframes blink{50%{opacity:0}}@keyframes bg{50%{background-position:100% 50%}}</style></head><body><main class="wrap"><section class="card" id="card"><div class="logo">⚡</div><div id="title" class="title">Secure Bot Access</div><div id="sub" class="sub">Connecting to this bot...</div><div id="request" class="secret-box"><label>SECRET ID REQUEST</label><input id="secret" autocomplete="off" placeholder="SDQXXXXXXXX"><button id="verify">Verify Secret ID</button><div id="error" class="error"></div></div><div id="chat" class="chat"><div id="messages" class="messages"></div><div id="limit" class="limit"></div><div class="composer"><input id="prompt" placeholder="Write a message..." autocomplete="off"><button id="send">Send</button></div><div id="chatError" class="error" style="display:none"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bopezesfrmdxiagvvyyh.supabase.co','sb_publishable_eLAz-YGqz0ET4n7t1g9BOA_suPeofcR',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const RUNTIME_URL='https://bopezesfrmdxiagvvyyh.supabase.co/functions/v1/bot-chat-runtime';const qs=new URLSearchParams(location.search);const botId=(qs.get('bot_id')||'').trim();const suppliedSecret='';let ticket='',bot=null;const $=id=>document.getElementById(id);let origin='unknown';try{origin=new URL(document.referrer||location.href).hostname||'unknown'}catch(e){}const key='sdq_ticket_'+btoa(origin).replace(/[^a-z0-9]/gi,'').slice(0,32)+'_'+botId.replace(/[^a-z0-9]/gi,'');function getCookie(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.split('=')[1]||''}function setCookie(n,v){document.cookie=n+'='+encodeURIComponent(v)+'; Max-Age=31536000; Path=/; Secure; SameSite=None'}function errText(c){return({BOT_DISABLED:'Bot disabled.',BOT_SUSPENDED:'Bot suspended.',CHAT_LIMIT_REACHED:'Chat limit reached.',REGISTERED_TICKET_REQUIRED:'Secret ID required.',INVALID_SECRET_ID:'Invalid Secret ID.',API_NOT_CONFIGURED:'AI service is not configured.',MODEL_NOT_CONFIGURED:'AI model is not configured.',INVALID_API_KEY:'Invalid API key.',NETWORK_ERROR:'Network error.'}[c]||'Unable to generate a response right now.')}function applyBackground(v){const m={'gradient:violet-gold':'linear-gradient(135deg,#24134d,#76551a,#0b1025)','gradient:midnight-blue':'linear-gradient(135deg,#020617,#0b1d45,#050816)','gradient:obsidian':'linear-gradient(135deg,#030303,#16131e,#050816)'};document.body.style.background=m[v]||'linear-gradient(135deg,#050816,#30206d,#0b1025)'}function add(w,t){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function openChat(info){bot=info;$('request').style.display='none';$('chat').style.display='block';$('title').textContent=info.name||'Secure Bot';$('sub').textContent='Secure connection established.';applyBackground(info.background_config);if(info.welcome_message&&!$('messages').children.length)add('bot',info.welcome_message)}async function connect(secret){secret=String(secret||'').trim().toUpperCase();$('error').textContent='';if(!botId){$('error').textContent='Missing Bot ID.';return false}if(!/^SDQ[A-Z0-9]{8}$/.test(secret)){$('error').textContent='Invalid Secret ID format.';return false}$('verify').disabled=true;$('verify').textContent='Connecting...';const check=await sb.rpc('get_public_bot_embed',{p_bot_id:botId,p_secret_id:secret});if(check.error||!check.data?.ok){$('error').textContent=errText(check.data?.error);$('verify').disabled=false;$('verify').textContent='Verify Secret ID';return false}const reg=await sb.rpc('register_public_bot_website',{p_bot_id:botId,p_secret_id:secret,p_origin:origin,p_referrer:document.referrer||null});if(reg.error||!reg.data?.ok){$('error').textContent=errText(reg.data?.error);$('verify').disabled=false;$('verify').textContent='Verify Secret ID';return false}ticket=reg.data.ticket;setCookie(key,ticket);openChat(check.data);return true}async function resume(){const saved=getCookie(key);if(!saved)return false;const t=decodeURIComponent(saved);const r=await sb.rpc('resume_public_bot_website',{p_bot_id:botId,p_ticket:t});if(!r.error&&r.data?.ok){const e=await sb.rpc('get_public_bot_embed_by_ticket',{p_bot_id:botId,p_ticket:t});if(!e.error&&e.data?.ok){ticket=t;openChat(e.data);return true}}return false}function thinking(){const d=document.createElement('div');d.className='msg bot';d.innerHTML='<span class="thinking">S</span>';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}async function typeAnswer(n,t){n.textContent='';const c=document.createElement('span');c.className='typing';n.appendChild(c);for(const ch of String(t||'')){c.before(document.createTextNode(ch));await new Promise(r=>setTimeout(r,ch==='.'||ch==='!'||ch==='?'?32:14));$('messages').scrollTop=$('messages').scrollHeight}c.remove()}async function send(){const text=$('prompt').value.trim();if(!text||!ticket)return;$('prompt').value='';add('user',text);const d=thinking();$('send').disabled=true;$('prompt').disabled=true;$('chatError').style.display='none';try{const r=await fetch(RUNTIME_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:botId,ticket,message:text})});const data=await r.json().catch(()=>({ok:false,code:'NETWORK_ERROR'}));if(!r.ok||!data.ok){d.textContent=errText(data.code);$('chatError').textContent=errText(data.code);$('chatError').style.display='block';$('prompt').disabled=false;$('send').disabled=false;return}await typeAnswer(d,data.answer);$('limit').textContent='Chat remaining: '+Number(data.remaining||0)+' / '+Number(data.limit||0);$('prompt').disabled=false;$('send').disabled=false}catch(e){d.textContent='Network error.';$('chatError').textContent='Network error.';$('chatError').style.display='block';$('prompt').disabled=false;$('send').disabled=false}}$('verify').onclick=()=>connect($('secret').value);$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};(async()=>{if(!botId){$('error').textContent='Missing Bot ID.';return}if(await resume())return;$('sub').textContent='Enter the Secret ID for this bot to start chatting.'})()</script></body></html>
