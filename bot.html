<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Bot</title><style>:root{--blue:#0b86f3;--bg:#f7f9fb;--danger:#d93025}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#20252b}body{min-height:100vh}.wrap{min-height:100vh;display:flex;justify-content:center}.card{width:100%;min-height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden}.brand{height:106px;flex:0 0 106px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0788f5,#0781ef);color:#fff;padding:14px 18px;box-shadow:0 3px 12px rgba(0,0,0,.08)}.title{margin:0;font-size:30px;font-weight:800;line-height:1.1;text-align:center}.sub{display:none}.secret-box{margin:24px auto;padding:22px;width:min(520px,calc(100% - 40px));border:1px solid #e3e8ee;border-radius:18px;background:#fff;box-shadow:0 10px 35px rgba(26,43,66,.08)}label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;color:#5c6670;margin-bottom:9px}input{width:100%;padding:14px;border-radius:14px;border:1px solid #d8dee5;background:#fff;color:#20252b;outline:0;font:inherit}input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(11,134,243,.10)}button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(11,134,243,.18)}button:disabled{opacity:.6;cursor:not-allowed}.error{margin-top:12px;color:var(--danger);font-size:12px;line-height:1.5}.chat{display:none;flex:1;min-height:0;flex-direction:column;background:#fff}.messages{flex:1;min-height:0;overflow:auto;padding:28px 30px 115px}.msg{padding:12px 16px;border-radius:17px;margin:10px 0;max-width:82%;line-height:1.55;font-size:15px;white-space:pre-wrap}.bot{background:#e9edf1;color:#30363d;border-top-left-radius:5px}.user{margin-left:auto;background:var(--blue);color:#fff;border-top-right-radius:5px}.composer{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:14px 20px 18px;background:rgba(255,255,255,.98);border-top:1px solid #e3e7eb;box-shadow:0 -5px 18px rgba(24,38,56,.06);z-index:5}.composer input{flex:1;height:58px;padding:0 20px;border-radius:30px;font-size:17px}.composer button{width:58px;height:58px;flex:0 0 58px;margin:0;padding:0;border-radius:50%;font-size:27px}.limit{position:fixed;right:22px;bottom:92px;font-size:10px;color:#7c858e;z-index:6}.thinking{width:29px;height:29px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid #9aa4ae;color:#65707a;font-weight:900;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:760px){.card{width:min(760px,100%);box-shadow:0 0 0 1px #edf0f3}.composer{left:50%;transform:translateX(-50%);width:min(760px,100%)}}@media(max-width:520px){.title{font-size:29px}.messages{padding:24px 30px 112px}.composer{padding:12px 20px 18px}.composer input{height:56px;font-size:16px}.composer button{width:56px;height:56px;flex-basis:56px}.limit{bottom:88px;right:18px}}</style></head><body><main class="wrap"><section class="card"><div class="brand"><div><div id="title" class="title">Bot</div><div id="sub" class="sub">Connecting...</div></div></div><div id="request" class="secret-box"><label>SECRET ID REQUEST</label><input id="secret" autocomplete="off" placeholder="SDQXXXXXXXX"><button id="verify" type="button">Verify Secret ID</button><div id="error" class="error"></div></div><div id="chat" class="chat"><div id="messages" class="messages"></div><div id="limit" class="limit"></div><div class="composer"><input id="prompt" placeholder="Rubuta tambayarka a nan..." autocomplete="off"><button id="send" type="button">➤</button></div><div id="chatError" class="error" style="display:none"></div></div></section></main><script>const CONNECT_URL='https://bopezesfrmdxiagvvyyh.supabase.co/functions/v1/public-bot-connect',RUNTIME_URL='https://bopezesfrmdxiagvvyyh.supabase.co/functions/v1/bot-chat-runtime',SUPABASE_PUBLISHABLE_KEY='sb_publishable_eLAz-YGqz0ET4n7t1g9BOA_suPeofcR',qs=new URLSearchParams(location.search),botId=(qs.get('bot_id')||'').trim();let ticket='',registrationOrigin='';const $=id=>document.getElementById(id);function origin(v){try{const u=new URL(String(v||'').trim());return /^https?:$/.test(u.protocol)?u.origin.toLowerCase():''}catch{return''}}function discover(){const q=origin(qs.get('site_origin'));if(q)return q;try{const r=origin(document.referrer);if(r)return r}catch{}try{const a=window.location.ancestorOrigins;if(a&&a.length){const r=origin(a[0]);if(r)return r}}catch{}return''}registrationOrigin=discover();const cookieKey='sdq_public_ticket_'+btoa(registrationOrigin||'unknown').replace(/[^a-z0-9]/gi,'').slice(0,40)+'_'+botId.replace(/[^a-z0-9]/gi,'');function getCookie(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.slice(n.length+1)||''}function setCookie(n,v){try{document.cookie=n+'='+encodeURIComponent(v)+'; Max-Age=31536000; Path=/; Secure; SameSite=None; Partitioned'}catch{}}function text(c){return({INVALID_SECRET_ID:'Incorrect Secret ID.',WEBSITE_ORIGIN_REQUIRED:'Website origin could not be detected. Please open the bot inside your website.',BOT_DISABLED:'Bot disabled.',BOT_SUSPENDED:'Bot suspended.',ALL_BOTS_DISABLED:'All bots are currently disabled.',NETWORK_ERROR:'Connection timed out. Please try again.',CONNECTION_SERVICE_ERROR:'Connection service is temporarily unavailable. Please try again.'}[c]||'Unable to connect right now.')}function openChat(info){$('request').style.display='none';$('chat').style.display='flex';$('title').textContent=(info.name||'Bot')+' 🛍️';if(info.welcome_message&&!$('messages').children.length)add('bot',info.welcome_message)}function add(w,t){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=1e9;return d}async function connectService(action,payload,timeout=30000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(CONNECT_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action,bot_id:botId,...payload}),signal:c.signal});const d=await r.json().catch(()=>({ok:false,error:'CONNECTION_SERVICE_ERROR'}));return d?.ok?d:{ok:false,error:d?.error||d?.code||'CONNECTION_SERVICE_ERROR'}}catch(e){return{ok:false,error:e.name==='AbortError'?'NETWORK_ERROR':'CONNECTION_SERVICE_ERROR'}}finally{clearTimeout(timer)}}async function ticketConnect(t){if(!t)return false;const r=await connectService('ticket',{ticket:t},15000);if(r.ok){ticket=t;setCookie(cookieKey,t);openChat(r);return true}return false}async function registered(){if(!registrationOrigin)return null;const r=await connectService('registered',{origin:registrationOrigin},15000);return r.ok&&r.ticket?String(r.ticket):null}async function auto(){if(!botId)return false;const s=getCookie(cookieKey);if(s&&await ticketConnect(decodeURIComponent(s)))return true;const t=await registered();return !!(t&&await ticketConnect(t))}async function verify(){const secret=$('secret').value.trim().toUpperCase();$('error').textContent='';if(!/^SDQ[A-Z0-9]{8}$/.test(secret)){$('error').textContent='Incorrect Secret ID.';return}if(!registrationOrigin){$('error').textContent=text('WEBSITE_ORIGIN_REQUIRED');return}$('verify').disabled=true;$('verify').textContent='Verifying...';try{const r=await connectService('register',{secret_id:secret,origin:registrationOrigin,referrer:document.referrer||registrationOrigin},30000);if(!r.ok){$('error').textContent=text(r.error);return}if(!r.ticket||String(r.ticket).length<32){$('error').textContent='Registration failed. Please try again.';return}ticket=String(r.ticket);setCookie(cookieKey,ticket);openChat(r)}finally{$('verify').disabled=false;$('verify').textContent='Verify Secret ID'}}function thinking(){const d=document.createElement('div');d.className='msg bot';d.innerHTML='<span class="thinking">S</span>';$('messages').appendChild(d);return d}async function send(){const message=$('prompt').value.trim();if(!message||!ticket)return;$('prompt').value='';add('user',message);const d=thinking();$('send').disabled=true;try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),15000);let r=await fetch(RUNTIME_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({bot_id:botId,ticket,message}),signal:c.signal});clearTimeout(tm);const data=await r.json().catch(()=>({ok:false,code:'NETWORK_ERROR'}));if(!data.ok){d.textContent=data.code==='INVALID_API_KEY'?'AI service is temporarily unavailable. Your website connection is still active.':text(data.code)}else d.textContent=data.answer||''}catch(e){d.textContent='Connection timed out. Please try again.'}finally{$('send').disabled=false}}$('verify').onclick=verify;$('secret').onkeydown=e=>{if(e.key==='Enter')verify()};$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};(async()=>{if(!botId){$('error').textContent='Missing Bot ID.';return}if(!await auto())$('sub').textContent='Enter the Secret ID for this bot to start chatting.'})()</script></body></html>
