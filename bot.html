<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Bot</title><style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#050816;color:#fff}*{box-sizing:border-box}.wrap{min-height:100vh;padding:20px;display:grid;place-items:center}.card{width:min(720px,100%);padding:24px;border:1px solid rgba(143,119,255,.22);border-radius:24px;background:rgba(7,13,31,.94);box-shadow:0 25px 70px rgba(0,0,0,.35);animation:in .4s ease}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#352070,#80601f);color:#f4d37a;font-size:22px;margin-bottom:16px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:#78859e;line-height:1.6}.secret-box{margin-top:22px;padding:18px;border:1px solid rgba(194,160,68,.25);border-radius:18px;background:rgba(194,160,68,.05)}label{display:block;font-size:11px;font-weight:700;color:#c7cee0;margin-bottom:8px}input{width:100%;padding:14px;border-radius:13px;border:1px solid rgba(143,119,255,.25);background:#030716;color:#fff;outline:0}input:focus{border-color:#9078ff;box-shadow:0 0 0 3px rgba(144,120,255,.1)}button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#7050dc,#b58c37);color:#fff;font-weight:800;cursor:pointer}.error{margin-top:12px;color:#ff9cac;font-size:11px}.chat{display:none}.messages{height:390px;overflow:auto;padding:12px 0}.msg{padding:11px 13px;border-radius:14px;margin:9px 0;max-width:85%;line-height:1.55;font-size:13px;white-space:pre-wrap}.bot{background:#101a35;border:1px solid rgba(143,119,255,.13)}.user{margin-left:auto;background:#4d328d}.composer{display:flex;gap:9px}.composer input{flex:1}.composer button{width:auto;margin:0;padding:0 18px}.thinking{display:inline-flex;gap:4px}.thinking i{width:5px;height:5px;border-radius:50%;background:#f4d37a;animation:b .8s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style></head><body><main class="wrap"><section class="card"><div class="logo">✦</div><div id="title" class="title">Secure Bot Access</div><div id="sub" class="sub">Enter the Secret ID for this bot to start chatting.</div><div id="request" class="secret-box"><label>SECRET ID REQUEST</label><input id="secret" autocomplete="off" placeholder="SDQXXXXXXXX"><button id="verify">Verify Secret ID</button><div id="error" class="error"></div></div><div id="chat" class="chat"><div id="messages" class="messages"></div><div class="composer"><input id="prompt" placeholder="Write a message..."><button id="send">Send</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bopezesfrmdxiagvvyyh.supabase.co','sb_publishable_eLAz-YGqz0ET4n7t1g9BOA_suPeofcR',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const id=new URLSearchParams(location.search).get('bot_id');let bot=null;const $=x=>document.getElementById(x);async function verify(){const secret=$('secret').value.trim().toUpperCase();$('error').textContent='';if(!/^SDQ[A-Z0-9]{8}$/.test(secret)){ $('error').textContent='Invalid Secret ID format.';return }const {data,error}=await sb.rpc('get_public_bot_embed',{p_bot_id:id,p_secret_id:secret});if(error||!data?.ok){$('error').textContent=data?.error==='BOT_DISABLED'?'Bot disabled.':data?.error==='BOT_SUSPENDED'?'Bot suspended.':'Invalid Secret ID.';return}bot=data;$('request').style.display='none';$('chat').style.display='block';$('title').textContent=data.name;$('sub').textContent='Secure connection established.';if(data.welcome_message)add('bot',data.welcome_message)}function add(w,t){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}async function send(){const text=$('prompt').value.trim();if(!text)return; $('prompt').value='';add('user',text);const d=document.createElement('div');d.className='msg bot';d.innerHTML='<span class="thinking"><i></i><i></i><i></i></span>';$('messages').appendChild(d);setTimeout(()=>{d.textContent='Bot runtime endpoint is not connected yet. The secure identity check succeeded, but chat generation will be connected in the Chat Runtime level.'},450)}$('verify').onclick=verify;$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter')send()};if(!id)$('error').textContent='Missing Bot ID.';</script></body></html>
