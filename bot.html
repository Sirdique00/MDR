<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Bot</title><style>:root{--bg:#050816;--card:rgba(8,14,34,.92);--line:rgba(143,119,255,.22);--violet:#8b6cff;--gold:#f4d37a;--muted:#7f8ba7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#050816,#30206d,#0b1025);color:#fff}body{animation:bg 14s ease-in-out infinite;background-size:200% 200%}.wrap{min-height:100vh;padding:20px;display:grid;place-items:center}.card{width:min(720px,100%);padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 25px 80px #0008;backdrop-filter:blur(12px)}.logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#4a2bb0,#9d7422);color:var(--gold);font-size:24px}.title{margin-top:16px;font-size:23px;font-weight:850}.sub{font-size:12px;color:var(--muted);line-height:1.65;margin-top:5px}.secret-box{margin-top:22px;padding:18px;border:1px solid #f4d37a2e;border-radius:20px;background:#f4d37a09}label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#d9def0;margin-bottom:9px}input{width:100%;padding:14px;border-radius:14px;border:1px solid #8f77ff40;background:#030716;color:#fff;outline:0;font:inherit}button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#704fe0,#b68b36);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 10px 28px #704fe02e}button:disabled{opacity:.6;cursor:not-allowed}.error{margin-top:12px;color:#ff9cac;font-size:11px;line-height:1.5}.success{margin-top:12px;color:#9ff0bd;font-size:11px;line-height:1.5}.chat{display:none}.messages{height:390px;overflow:auto;padding:14px 2px}.msg{padding:11px 13px;border-radius:15px;margin:9px 0;max-width:85%;line-height:1.55;font-size:13px;white-space:pre-wrap}.bot{background:#101a35c2;border:1px solid #8f77ff21}.user{margin-left:auto;background:linear-gradient(135deg,#4d328d,#5c3ba2)}.composer{display:flex;gap:9px}.composer input{flex:1}.composer button{width:auto;margin:0;padding:0 18px}.limit{margin-top:10px;font-size:10px;color:#7f8ba7}.thinking{width:29px;height:29px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid #f4d37a61;color:var(--gold);font-weight:900;animation:spin 1s linear infinite}.typing{display:inline-block;width:6px;height:14px;margin-left:2px;background:var(--gold);animation:blink .75s steps(1) infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes bg{50%{background-position:100% 50%}}</style></head><body><main class="wrap"><section class="card"><div class="logo">⚡</div><div id="title" class="title">Secure Bot Access</div><div id="sub" class="sub">Connecting to this bot...</div><div id="request" class="secret-box"><label>SECRET ID REQUEST</label><input id="secret" autocomplete="off" placeholder="SDQXXXXXXXX"><button id="verify" type="button">Verify Secret ID</button><div id="error" class="error"></div></div><div id="chat" class="chat"><div id="messages" class="messages"></div><div id="limit" class="limit"></div><div class="composer"><input id="prompt" placeholder="Write a message..." autocomplete="off"><button id="send" type="button">Send</button></div><div id="chatError" class="error" style="display:none"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bopezesfrmdxiagvvyyh.supabase.co','sb_publishable_eLAz-YGqz0ET4n7t1g9BOA_suPeofcR',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const RUNTIME_URL='https://bopezesfrmdxiagvvyyh.supabase.co/functions/v1/bot-chat-runtime',qs=new URLSearchParams(location.search),botId=(qs.get('bot_id')||'').trim();let ticket='',bot=null,verifiedSecret='',registrationOrigin='';const $=id=>document.getElementById(id);try{registrationOrigin=new URL(document.referrer||'').origin}catch(e){}if(!registrationOrigin||registrationOrigin==='null')registrationOrigin='';const cookieKey='sdq_public_ticket_'+btoa(registrationOrigin||'unknown').replace(/[^a-z0-9]/gi,'').slice(0,40)+'_'+botId.replace(/[^a-z0-9]/gi,'');function getCookie(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.slice(n.length+1)||''}function setCookie(n,v){document.cookie=n+'='+encodeURIComponent(v)+'; Max-Age=31536000; Path=/; Secure; SameSite=None; Partitioned'}function errText(c){return({BOT_DISABLED:'Bot disabled.',BOT_SUSPENDED:'Bot suspended.',CHAT_LIMIT_REACHED:'Chat limit reached.',REGISTERED_TICKET_REQUIRED:'This website connection is no longer valid.',INVALID_SECRET_ID:'Incorrect Secret ID.',ALL_BOTS_DISABLED:'All bots are currently disabled.',BOT_NOT_FOUND:'Bot not found.',API_NOT_CONFIGURED:'AI service is not configured.',MODEL_NOT_CONFIGURED:'AI model is not configured.',INVALID_API_KEY:'Invalid API key.',NETWORK_ERROR:'Connection timed out. Please try again.'}[c]||'Unable to generate a response right now.')}function applyBackground(v){const m={'gradient:violet-gold':'linear-gradient(135deg,#24134d,#76551a,#0b1025)','gradient:midnight-blue':'linear-gradient(135deg,#020617,#0b1d45,#050816)','gradient:obsidian':'linear-gradient(135deg,#030303,#16131e,#050816)'};document.body.style.background=m[v]||'linear-gradient(135deg,#050816,#30206d,#0b1025)'}function add(w,t){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}function openChat(info){bot=info;$('request').style.display='none';$('chat').style.display='block';$('title').textContent=info.name||'Secure Bot';$('sub').textContent='Secure connection established.';applyBackground(info.background_config);if(info.welcome_message&&!$('messages').children.length)add('bot',info.welcome_message)}async function withTimeout(promise,ms=7000){let timer;const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('TIMEOUT')),ms)});try{return await Promise.race([promise,timeout])}finally{clearTimeout(timer)}}async function rpc(name,args){return withTimeout(sb.rpc(name,args),7000)}async function connectWithTicket(t){if(!t)return false;try{const r=await rpc('get_public_bot_embed_by_ticket',{p_bot_id:botId,p_ticket:t});if(!r.error&&r.data?.ok){ticket=t;setCookie(cookieKey,t);openChat(r.data);return true}return false}catch(e){return false}}async function issueTicketForOrigin(){if(!registrationOrigin)return null;try{const r=await rpc('get_registered_public_bot_website',{p_bot_id:botId,p_origin:registrationOrigin});if(!r.error&&r.data?.ok&&r.data.ticket)return String(r.data.ticket)}catch(e){}return null}async function autoConnect(){if(!botId)return false;const saved=getCookie(cookieKey);if(saved&&await connectWithTicket(decodeURIComponent(saved)))return true;const fresh=await issueTicketForOrigin();if(fresh&&await connectWithTicket(fresh))return true;return false}async function registerSecret(secret){const clean=String(secret||'').trim().toUpperCase();if(!botId){$('error').textContent='Missing Bot ID.';return false}if(!/^SDQ[A-Z0-9]{8}$/.test(clean)){$('error').textContent='Incorrect Secret ID.';return false}try{const reg=await rpc('register_public_bot_website',{p_bot_id:botId,p_secret_id:clean,p_origin:registrationOrigin||'unknown',p_referrer:document.referrer||null});if(reg.error||!reg.data?.ok){$('error').textContent=errText(reg.data?.error||'NETWORK_ERROR');return false}if(!reg.data.ticket){$('error').textContent='Registration failed. Please try again.';return false}verifiedSecret=clean;ticket=String(reg.data.ticket);setCookie(cookieKey,ticket);openChat(reg.data);return true}catch(e){$('error').textContent=e?.message==='TIMEOUT'?'Connection timed out. Please try again.':'Unable to verify Secret ID right now.';return false}}async function reconnectWithStoredAuthorization(){if(verifiedSecret)return registerSecret(verifiedSecret);const fresh=await issueTicketForOrigin();if(fresh){ticket=fresh;setCookie(cookieKey,fresh);return connectWithTicket(fresh)}return false}async function connect(secret){$('error').textContent='';$('verify').disabled=true;$('verify').textContent='Verifying...';try{return await registerSecret(secret)}finally{$('verify').disabled=false;$('verify').textContent='Verify Secret ID'}}function thinking(){const d=document.createElement('div');d.className='msg bot';d.innerHTML='<span class="thinking">S</span>';$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}async function typeAnswer(n,t){n.textContent='';const c=document.createElement('span');c.className='typing';n.appendChild(c);for(const ch of String(t||'')){c.before(document.createTextNode(ch));await new Promise(r=>setTimeout(r,ch==='.'||ch==='!'||ch==='?'?32:14));$('messages').scrollTop=$('messages').scrollHeight}c.remove()}async function runtime(text){try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);const r=await fetch(RUNTIME_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:botId,ticket,message:text}),signal:controller.signal});clearTimeout(timer);return {http:r.status,data:await r.json().catch(()=>({ok:false,code:'NETWORK_ERROR'}))}}catch(e){return {http:0,data:{ok:false,code:'NETWORK_ERROR'}}}}async function send(){const text=$('prompt').value.trim();if(!text||!ticket)return;$('prompt').value='';add('user',text);const d=thinking();$('send').disabled=true;$('prompt').disabled=true;$('chatError').style.display='none';try{let r=await runtime(text);if(r.data.code==='REGISTERED_TICKET_REQUIRED'){const recovered=await reconnectWithStoredAuthorization();if(recovered)r=await runtime(text)}if(!r.data.ok){d.textContent=errText(r.data.code);$('chatError').textContent=errText(r.data.code);$('chatError').style.display='block'}else{await typeAnswer(d,r.data.answer);$('limit').textContent='Chat remaining: '+Number(r.data.remaining||0)+' / '+Number(r.data.limit||0)}}finally{$('prompt').disabled=false;$('send').disabled=false}}$('verify').onclick=()=>connect($('secret').value);$('secret').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();connect($('secret').value)}};$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};(async()=>{if(!botId){$('error').textContent='Missing Bot ID.';return}if(await autoConnect())return;$('sub').textContent=registrationOrigin?'This website is not registered for this bot. Enter the Secret ID once to register it.':'Enter the Secret ID for this bot to start chatting.'})()</script></body></html>
