<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />
  <meta name="description" content="Sadeeq private AI control system" />
  <title>Sadeeq — Private AI Control System</title>
  <link rel="icon" type="image/svg+xml" href="./chagi-logo.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="landing-shell">
    <section class="landing-card" aria-label="Sadeeq private system">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="grid-glow"></div>

      <div class="brand-mark-wrap">
        <div class="brand-ring"></div>
        <img class="logo landing-logo" src="./chagi-logo.svg" alt="Chagi lightning logo" />
      </div>

      <div class="brand-name landing-name">SADEEQ</div>
      <div class="brand-subtitle landing-subtitle">PRIVATE AI CONTROL SYSTEM</div>

      <div class="system-status">
        <span class="status-dot"></span>
        <span>SYSTEM SECURED</span>
      </div>

      <div class="landing-divider"></div>

      <p class="landing-message">
        A private control environment for managing AI bots, models, websites and system operations.
      </p>

      <div class="owner-badge">
        <span class="owner-icon">⚡</span>
        <div>
          <strong>OWNER ONLY</strong>
          <small>Authorized access required</small>
        </div>
      </div>

      <div class="landing-footer">
        <span>CHAGI ⚡ SADEEQ</span>
        <span>PRIVATE SYSTEM</span>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
